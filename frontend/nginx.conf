worker_processes auto;

# OpenShift assigns a random non-root UID, so nginx cannot write its default
# pid file under /var/run; redirect it to /tmp, which is always writable.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Same reasoning as above: /var/cache/nginx/* is not writable by an
    # arbitrary UID, so all temp buffers are relocated to /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;

    server {
        # Non-root containers cannot bind to ports below 1024.
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            # Serve the requested file/dir, or fall back to index.html for Vue Router history mode.
            try_files $uri $uri/ /index.html;
        }
    }
}
